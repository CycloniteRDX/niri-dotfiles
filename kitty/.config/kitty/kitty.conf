font_family Noto Sans Mono
font_size 11.0
scrollback_lines 10000
wheel_scroll_multiplier 3.0
enable_audio_bell no
confirm_os_window_close 0
copy_on_select no
strip_trailing_spaces smart
window_padding_width 8
background_opacity 1.0
foreground #dce7f2
background #0b0f17
selection_foreground #0b0f17
selection_background #5ce1e6
cursor #f05adf
cursor_text_color #0b0f17
url_color #5ce1e6
color0  #121824
color1  #ff6b81
color2  #7bd88f
color3  #f3c969
color4  #75a7ff
color5  #f05adf
color6  #5ce1e6
color7  #dce7f2
color8  #52647a
color9  #ff6b81
color10 #7bd88f
color11 #f3c969
color12 #75a7ff
color13 #f05adf
color14 #5ce1e6
color15 #ffffff
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
