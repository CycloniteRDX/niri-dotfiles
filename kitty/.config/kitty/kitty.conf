# ============================================================
# Kitty
# ============================================================
#
# Design goals:
# - dark cyan/magenta theme matching Niri and Waybar
# - slightly transparent background
# - minimal visual noise
# - comfortable defaults for daily terminal use
# - preserve Kitty's useful built-in shortcuts and features


# ------------------------------------------------------------
# Font
# ------------------------------------------------------------

font_family Noto Sans Mono
font_size 11.0


# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

cursor #f05adf
cursor_text_color #0b0f17


# ------------------------------------------------------------
# Scrollback
# ------------------------------------------------------------

# Large enough for normal terminal work without keeping an
# unnecessarily huge in-memory scrollback.
scrollback_lines 10000

# Mouse wheel: slightly slower than Kitty's default 5.0.
wheel_scroll_multiplier 3.0

# High-precision Wayland touchpad scrolling.
# Keep this neutral because touchpad scroll speed is already
# tuned globally in Niri.
touch_scroll_multiplier 1.0

# Smooth sub-line scrolling with a touchpad.
pixel_scroll yes

# Show a small scrollbar only after scrolling backwards.
scrollbar scrolled
scrollbar_handle_color #5ce1e6
scrollbar_track_opacity 0.0


# ------------------------------------------------------------
# Mouse
# ------------------------------------------------------------

# Hide the pointer immediately when typing and show it again
# when the mouse is used.
mouse_hide_wait -1.0

copy_on_select no

# Remove trailing spaces intelligently when copying text.
strip_trailing_spaces smart


# ------------------------------------------------------------
# URLs
# ------------------------------------------------------------

url_color #5ce1e6
url_style straight

# Use the desktop's default handler (Firefox in our setup).
open_url_with default


# ------------------------------------------------------------
# Clipboard / paste safety
# ------------------------------------------------------------

# Programs may write to the clipboard, but reading it requires
# confirmation. This also protects against remote programs
# reading the local clipboard over SSH without permission.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Keep Kitty's safer paste behavior.
paste_actions quote-urls-at-prompt,confirm


# ------------------------------------------------------------
# Window appearance
# ------------------------------------------------------------

window_padding_width 8
placement_strategy center

background #0b0f17
foreground #dce7f2

# Slight transparency: wallpaper is visible without hurting
# readability too much.
background_opacity 0.94

# Keep blur disabled. The subtle transparency is enough and
# avoids unnecessary rendering overhead.
background_blur 0

selection_foreground #0b0f17
selection_background #5ce1e6


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

# Only show the tab bar when it is actually useful.
tab_bar_min_tabs 2

# A simple flat/separator style rather than Powerline-style tabs.
tab_bar_style separator
tab_separator " │ "
tab_bar_align start
tab_bar_show_new_tab_button no

active_tab_foreground #0b0f17
active_tab_background #5ce1e6
active_tab_font_style bold

inactive_tab_foreground #dce7f2
inactive_tab_background #121824
inactive_tab_font_style normal

tab_bar_background #0b0f17


# ------------------------------------------------------------
# Shell integration
# ------------------------------------------------------------

shell_integration enabled

# Notify through the desktop notification system when a command
# takes at least 15 seconds and its terminal is no longer visible.
notify_on_cmd_finish unfocused 15.0


# ------------------------------------------------------------
# Bell / closing behavior
# ------------------------------------------------------------

enable_audio_bell no

# Do not ask for confirmation when closing the OS window.
confirm_os_window_close 0


# ------------------------------------------------------------
# Color palette
# ------------------------------------------------------------

color0  #121824
color1  #ff6b81
color2  #7bd88f
color3  #f3c969
color4  #75a7ff
color5  #f05adf
color6  #5ce1e6
color7  #dce7f2

color8  #52647a
color9  #ff6b81
color10 #7bd88f
color11 #f3c969
color12 #75a7ff
color13 #f05adf
color14 #5ce1e6
color15 #ffffff


# ------------------------------------------------------------
# Custom shortcuts
# ------------------------------------------------------------

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Kitty "windows" are panes inside a Kitty tab.
map ctrl+shift+enter new_window_with_cwd

# New tab inheriting the current working directory.
map ctrl+shift+t new_tab_with_cwd


# ------------------------------------------------------------
# Cursor trail
# ------------------------------------------------------------

# Animate larger text-cursor jumps while avoiding trails for
# ordinary one-cell movement during normal typing.
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #f05adf
