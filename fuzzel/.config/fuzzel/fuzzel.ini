# ============================================================
# Fuzzel
# ============================================================
#
# Design goals:
# - dark cyan/magenta theme matching Niri, Waybar, Kitty and Mako
# - compact application launcher
# - useful fzf-style matching without excessive result noise
# - reusable as a dmenu-style selector for scripts and actions


[main]

terminal=kitty
font=Noto Sans:size=12

prompt="Run: "

width=45
lines=12

horizontal-pad=18
vertical-pad=12
inner-pad=8

# Keep the launcher visible above fullscreen applications.
layer=overlay

# Display current match count at the right of the input field.
match-counter=yes

# Search useful desktop-entry metadata without making matching too broad.
fields=name,generic,exec,keywords

# Flexible but predictable matching.
match-mode=fzf


[colors]

background=121824f2
text=dce7f2ff

# Magenta prompt, neutral typed text.
prompt=f05adfff
input=dce7f2ff

# Cyan highlight for matched characters.
match=5ce1e6ff

selection=1b2638ff
selection-text=ffffffff
selection-match=5ce1e6ff

# Muted match counter.
counter=52647aff

border=5ce1e6ff


[border]

width=2
radius=8

# Slightly rounded currently selected application.
selection-radius=6
